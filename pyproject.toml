[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socmind"
version = "1.2.0"
description = "Cross-platform SOC Tier 1/2 investigation, detection-engineering and integration toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mohamed Abdelnaby"}]
keywords = ["soc", "blue-team", "dfir", "siem", "windows", "linux", "kali", "wazuh", "elastic", "sigma", "mitre-attack"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
evtx = ["python-evtx>=0.8.1"]
sigma = ["PyYAML>=6.0.2"]
web = ["fastapi>=0.116.0", "uvicorn>=0.35.0"]
all = ["python-evtx>=0.8.1", "PyYAML>=6.0.2", "fastapi>=0.116.0", "uvicorn>=0.35.0"]

[project.scripts]
socmind = "socmind.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/socmind"]
