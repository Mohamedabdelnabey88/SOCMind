[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socmind"
version = "0.1.0"
description = "Cross-platform SOC Tier 1/2 investigation and evidence-correlation toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mohamed Abdelnaby"}]
dependencies = []

[project.scripts]
socmind = "socmind.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
