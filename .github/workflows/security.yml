name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socmind-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SOCMind and all supported extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pip-audit
      - name: Audit installed dependencies
        run: pip-audit --local --format=json --output pip-audit.json
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 14

  static-security-analysis:
    name: Static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit
      - name: Scan application code for high-severity findings
        run: bandit --recursive src/socmind --severity-level high --confidence-level medium --format json --output bandit-report.json
      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn
          retention-days: 14
