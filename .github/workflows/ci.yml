name: CI

on:
  push:
  pull_request:

concurrency:
  group: socmind-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[sigma,web]" pytest httpx
      - run: python -m compileall -q src
      - run: node --check src/socmind/web/app.js
      - run: pytest -q
      - run: socmind analyze examples/attack_chain.jsonl --timeline --iocs --graph --process-tree --hypotheses --case-output case.json --case-id CI-WINDOWS
      - run: socmind analyze examples/linux_attack_chain.jsonl --timeline --iocs --graph --hypotheses --case-output linux-case.json --case-id CI-LINUX
      - run: socmind detect detections/windows/suspicious-powershell.yml tests/fixtures/rule-events.jsonl
      - run: socmind rule-test detections/windows/suspicious-powershell.yml tests/fixtures/powershell-rule-test.json
      - run: socmind coverage examples/attack_chain.jsonl --rules detections
      - run: socmind gaps examples/attack_chain.jsonl --rules detections
      - run: socmind tune examples/dispositions.jsonl
      - run: socmind ingest wazuh tests/fixtures/wazuh-alerts.jsonl -o wazuh.jsonl
      - run: socmind ingest elastic tests/fixtures/elastic-events.ndjson -o elastic.jsonl
      - run: socmind enrich examples/attack_chain.jsonl --local-intel examples/local-intel.json
      - run: socmind note analyst-notes.jsonl --case-id CI-001 --author ci --text "Validated test evidence" --disposition needs-review
      - run: socmind escalate examples/attack_chain.jsonl --case-id CI-001 -o escalation.md
      - run: socmind case-init operational-case.json --case-id CI-OPS-001 --priority P1 --owner analyst1
      - run: socmind case-transition operational-case.json --state triage
      - run: socmind case-assign operational-case.json --owner tier2
      - run: socmind sla operational-case.json
      - run: socmind evidence examples/attack_chain.jsonl
      - run: socmind handoff examples/attack_chain.jsonl --case-id CI-OPS-001 -o shift-handoff.md
      - run: socmind audit analyst-audit.jsonl --case-id CI-OPS-001 --actor tier2 --action investigated --detail "Validated authentication and process evidence"
      - run: socmind investigate examples/attack_chain.jsonl -o investigation-workspace --case-id CI-WORKSPACE-001 --priority P1 --owner tier2
      - run: socmind command-register socmind.db operational-case.json --source wazuh --title "CI authentication case"
      - run: socmind command-ack socmind.db CI-OPS-001
      - run: socmind command-center socmind.db
      - run: socmind lead-health examples/attack_chain.jsonl --rules detections --dispositions examples/dispositions.jsonl
      - run: socmind shift-brief socmind.db examples/attack_chain.jsonl --rules detections --dispositions examples/dispositions.jsonl -o ci-shift-brief.md
      - run: socmind command-register socmind.db operational-case.json --source wazuh --title "Linked evidence case" --events examples/attack_chain.jsonl
      - run: socmind command-assign socmind.db CI-OPS-001 --owner senior-analyst --actor lead
      - run: socmind command-note socmind.db CI-OPS-001 --author senior-analyst --text "Reviewed linked evidence" --disposition needs-review
      - run: socmind command-show socmind.db CI-OPS-001
      - run: socmind demo-init -o ci-demo
      - run: socmind help
      - run: socmind help integrations
      - run: socmind doctor
      - run: socmind --version
      - run: socmind help security
      - run: socmind help performance
      - run: socmind security-check
      - run: socmind benchmark --events 2000 --json
      - run: socmind help ire
      - run: socmind replay examples/attack_chain.jsonl --json
      - run: socmind detection-replay examples/attack_chain.jsonl --rules detections --json
      - run: socmind what-if examples/attack_chain.jsonl --current-rules detections --proposed-rules examples/proposed-rules --json
      - run: socmind case-review examples/attack_chain.jsonl --checklist examples/quality-checklist.json --json
      - run: socmind learn-from-case examples/attack_chain.jsonl --rules detections --case-id CI-IRE-001 -o ire-regression
      - run: socmind help reasoning
      - run: socmind contradictions examples/attack_chain.jsonl --json
      - run: socmind similar-cases examples/attack_chain.jsonl --database ci-demo/socmind-demo.db --exclude-case-id DEMO-P1-001 --json
      - run: socmind help enterprise
      - run: socmind enterprise-info --json
      - run: socmind postgres-schema -o socmind-postgres.sql

  kali:
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
    steps:
      - name: Install Kali prerequisites
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-venv python3-pip
      - uses: actions/checkout@v4
      - name: Create isolated Kali environment
        run: python3 -m venv .venv
      - name: Install SOCMind in Kali venv
        run: .venv/bin/pip install -e ".[sigma,web]" pytest httpx
      - name: Run test suite on Kali
        run: .venv/bin/pytest -q
      - name: Exercise Kali investigation workflow
        run: .venv/bin/socmind analyze examples/linux_attack_chain.jsonl --timeline --iocs --graph --hypotheses --case-output kali-case.json --case-id CI-KALI
      - name: Exercise Wazuh adapter on Kali
        run: .venv/bin/socmind ingest wazuh tests/fixtures/wazuh-alerts.jsonl -o wazuh-kali.jsonl
      - name: Exercise Elastic adapter on Kali
        run: .venv/bin/socmind ingest elastic tests/fixtures/elastic-events.ndjson -o elastic-kali.jsonl
      - name: Exercise enrichment on Kali
        run: .venv/bin/socmind enrich examples/attack_chain.jsonl --local-intel examples/local-intel.json
      - name: Exercise escalation on Kali
        run: .venv/bin/socmind escalate examples/linux_attack_chain.jsonl --case-id CI-KALI -o kali-escalation.md
      - name: Exercise detection workflow on Kali
        run: .venv/bin/socmind coverage examples/attack_chain.jsonl --rules detections
      - name: Exercise SOC case workflow on Kali
        run: |
          .venv/bin/socmind case-init kali-ops.json --case-id KALI-OPS-001 --priority P1 --owner analyst1
          .venv/bin/socmind case-transition kali-ops.json --state triage
          .venv/bin/socmind case-assign kali-ops.json --owner tier2
          .venv/bin/socmind sla kali-ops.json
          .venv/bin/socmind evidence examples/linux_attack_chain.jsonl
          .venv/bin/socmind handoff examples/linux_attack_chain.jsonl --case-id KALI-OPS-001 -o kali-handoff.md
          .venv/bin/socmind audit kali-audit.jsonl --case-id KALI-OPS-001 --actor tier2 --action investigated --detail "Reviewed Linux evidence"
          .venv/bin/socmind investigate examples/linux_attack_chain.jsonl -o kali-workspace --case-id KALI-WORKSPACE-001 --priority P1 --owner tier2
          .venv/bin/socmind command-register kali-soc.db kali-ops.json --source elastic --title "Kali Linux investigation"
          .venv/bin/socmind command-ack kali-soc.db KALI-OPS-001
          .venv/bin/socmind command-center kali-soc.db
          .venv/bin/socmind lead-health examples/linux_attack_chain.jsonl --rules detections --dispositions examples/dispositions.jsonl
          .venv/bin/socmind shift-brief kali-soc.db examples/linux_attack_chain.jsonl --rules detections --dispositions examples/dispositions.jsonl -o kali-shift-brief.md
          .venv/bin/socmind command-register kali-soc.db kali-ops.json --source elastic --title "Linked Kali evidence" --events examples/linux_attack_chain.jsonl
          .venv/bin/socmind command-note kali-soc.db KALI-OPS-001 --author tier2 --text "Validated linked Linux evidence"
          .venv/bin/socmind command-show kali-soc.db KALI-OPS-001
          .venv/bin/socmind demo-init -o kali-demo
          .venv/bin/socmind help integrations
          .venv/bin/socmind doctor
          .venv/bin/socmind --version
          .venv/bin/socmind help security
          .venv/bin/socmind security-check
          .venv/bin/socmind benchmark --events 2000 --json
          .venv/bin/socmind help ire
          .venv/bin/socmind replay examples/attack_chain.jsonl --json
          .venv/bin/socmind detection-replay examples/attack_chain.jsonl --rules detections --json
          .venv/bin/socmind what-if examples/attack_chain.jsonl --current-rules detections --proposed-rules examples/proposed-rules --json
          .venv/bin/socmind case-review examples/attack_chain.jsonl --checklist examples/quality-checklist.json --json
          .venv/bin/socmind learn-from-case examples/attack_chain.jsonl --rules detections --case-id KALI-IRE-001 -o kali-ire-regression
          .venv/bin/socmind help reasoning
          .venv/bin/socmind contradictions examples/attack_chain.jsonl --json
          .venv/bin/socmind similar-cases examples/attack_chain.jsonl --database kali-demo/socmind-demo.db --exclude-case-id DEMO-P1-001 --json
          .venv/bin/socmind help enterprise
          .venv/bin/socmind enterprise-info --json
          .venv/bin/socmind postgres-schema -o kali-postgres.sql
      - name: Exercise web dashboard on Kali
        shell: bash
        run: |
          .venv/bin/socmind web examples/attack_chain.jsonl --case-id CI-KALI-WEB --command-db kali-soc.db --rules detections --proposed-rules examples/proposed-rules --quality-checklist examples/quality-checklist.json --dispositions examples/dispositions.jsonl --api-token ci-secret --host 127.0.0.1 --port 8765 > /tmp/socmind-web.log 2>&1 &
          pid=$!
          sleep 3
          python3 -c "import json,urllib.request; hdr={'X-SOCMind-Token':'ci-secret'}; get=lambda p: json.load(urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8765'+p,headers=hdr))); h=json.load(urllib.request.urlopen('http://127.0.0.1:8765/health')); l=get('/api/lead-health'); w=get('/api/ire/what-if'); q=get('/api/ire/quality'); c=get('/api/reasoning/contradictions'); s=get('/api/reasoning/similar'); assert h['status']=='ok' and h['auth_required'] and l['summary']['rules']>0 and w['enabled'] and w['first_detection_step_improvement']>0 and q['total']>=10 and c['summary']['hypotheses']>0 and s['enabled']"
          kill $pid


  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv wheel-venv
      - run: wheel-venv/bin/pip install dist/*.whl fastapi uvicorn PyYAML
      - run: wheel-venv/bin/socmind --version
      - run: wheel-venv/bin/socmind help getting-started
      - run: wheel-venv/bin/socmind help ire
      - run: wheel-venv/bin/socmind detection-replay examples/attack_chain.jsonl --rules detections --json
      - run: wheel-venv/bin/socmind contradictions examples/attack_chain.jsonl --json
      - run: wheel-venv/bin/socmind help enterprise
      - run: wheel-venv/bin/socmind enterprise-info --json
      - run: wheel-venv/bin/socmind doctor
      - name: Verify packaged web assets
        shell: bash
        run: |
          wheel-venv/bin/socmind web examples/attack_chain.jsonl --case-id PKG-CHECK --rules detections --proposed-rules examples/proposed-rules --quality-checklist examples/quality-checklist.json --host 127.0.0.1 --port 8877 > /tmp/socmind-pkg.log 2>&1 &
          pid=$!
          sleep 3
          python -c "import json,urllib.request; data=urllib.request.urlopen('http://127.0.0.1:8877/').read().decode(); ire=json.load(urllib.request.urlopen('http://127.0.0.1:8877/api/ire/detection-replay')); assert 'SOCMind' in data and 'Investigation Replay' in data and ire['first_detection_step'] is not None"
          kill $pid


  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: socmind
          POSTGRES_PASSWORD: socmind
          POSTGRES_DB: socmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socmind -d socmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOCMIND_POSTGRES_DSN: postgresql://socmind:socmind@127.0.0.1:5432/socmind
      SOCMIND_TEST_POSTGRES_DSN: postgresql://socmind:socmind@127.0.0.1:5432/socmind
      SOCMIND_TRUSTED_PROXY_SECRET: ci-proxy-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[sigma,web,enterprise]" pytest httpx
      - run: socmind postgres-init
      - run: socmind postgres-health --json
      - run: pytest -q tests/test_enterprise_foundation.py tests/test_postgres_enterprise.py
      - run: socmind enterprise-info --json
      - run: socmind trusted-sign --subject ci-analyst@example.com --role analyst
